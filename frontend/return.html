<!DOCTYPE html>
<html>
<head>
<title>Return Book</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="js/script.js"></script>
</head>
<body class="container mt-4">

<h3>Return Book</h3>

<form id="returnForm" onsubmit="return validateForm('returnForm')">

<input required class="form-control my-2" placeholder="Book Name">
<input required class="form-control my-2" placeholder="Serial Number">

<label>Expected Return</label>
<input type="date" id="expectedReturn" class="form-control my-2">

<label>Actual Return</label>
<input type="date" id="actualReturn" class="form-control my-2" onchange="calculateFine()">

<button class="btn btn-danger">Confirm Return</button>

</form>

</body>
</html>
