<!DOCTYPE html>
<html>
<head>
<title>Add Membership</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="js/script.js"></script>
</head>
<body class="container mt-4">

<h3>Add Membership</h3>

<form id="addMemberForm" onsubmit="return validateForm('addMemberForm')">

<input required class="form-control my-2" placeholder="First Name">
<input required class="form-control my-2" placeholder="Last Name">
<input required class="form-control my-2" placeholder="Contact Number">
<input required class="form-control my-2" placeholder="Address">
<input required class="form-control my-2" placeholder="Aadhar Number">

<label>Membership Duration</label><br>

<input type="radio" name="duration" value="6" checked> 6 Months
<input type="radio" name="duration" value="12"> 1 Year
<input type="radio" name="duration" value="24"> 2 Years

<br><br>
<button class="btn btn-success">Confirm</button>

</form>

</body>
</html>
