<!DOCTYPE html>
<html>
<head>
<title>Add Book / Movie</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h3>Add Book / Movie</h3>

<form>

<label>Type</label><br>
<input type="radio" name="type" checked> Book
<input type="radio" name="type"> Movie

<input required class="form-control my-2" placeholder="Name">
<input required class="form-control my-2" placeholder="Author">
<input required class="form-control my-2" placeholder="Category">
<input required type="date" class="form-control my-2">

<input type="number" value="1" class="form-control my-2">

<button class="btn btn-success">Add</button>

</form>

</body>
</html>
