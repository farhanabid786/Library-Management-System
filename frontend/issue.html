<!DOCTYPE html>
<html>
<head>
<title>Issue Book</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="js/script.js"></script>
</head>
<body class="container mt-4">

<h3>Issue Book</h3>

<form id="issueForm" onsubmit="return validateForm('issueForm')">

<label class="required">Book Name</label>
<input required class="form-control my-2">

<label>Author</label>
<input class="form-control my-2" value="Auto Populated" readonly>

<label class="required">Issue Date</label>
<input type="date" id="issueDate" required class="form-control my-2" onchange="setReturnDate()">

<label>Return Date</label>
<input type="date" id="returnDate" readonly class="form-control my-2">

<label>Remarks</label>
<textarea class="form-control my-2"></textarea>

<button class="btn btn-success">Confirm</button>

</form>

</body>
</html>
