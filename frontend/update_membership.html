<!DOCTYPE html>
<html>
<head>
<title>Update Membership</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h3>Update Membership</h3>

<form>

<input required class="form-control my-2" placeholder="Membership Number">

<label>Extend Membership</label><br>
<input type="radio" name="extend" checked> 6 Months
<input type="radio" name="extend"> 1 Year
<input type="radio" name="extend"> 2 Years

<br><br>

<input type="radio" name="status"> Cancel Membership

<br><br>
<button class="btn btn-primary">Update</button>

</form>

</body>
</html>
