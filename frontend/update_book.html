<!DOCTYPE html>
<html>
<head>
<title>Update Book</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h3>Update Book / Movie</h3>

<form>

<label>Type</label><br>
<input type="radio" name="type" checked> Book
<input type="radio" name="type"> Movie

<input required class="form-control my-2" placeholder="Name">
<input required class="form-control my-2" placeholder="Serial Number">

<select class="form-select my-2">
<option>Available</option>
<option>Unavailable</option>
<option>Removed</option>
<option>On Repair</option>
<option>To Replace</option>
</select>

<button class="btn btn-primary">Update</button>

</form>

</body>
</html>
