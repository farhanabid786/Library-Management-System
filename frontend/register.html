<!DOCTYPE html>
<html>
<head>
<title>Register - Library</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/script.js"></script>

</head>
<body class="d-flex justify-content-center align-items-center">

<div class="login-card text-center" style="width:450px;">
<h2 class="mb-4">📚 Create Account</h2>

<form onsubmit="return registerUser()">

<input id="regName" class="form-control my-2" placeholder="Full Name" required>

<input id="regUsername" class="form-control my-2" placeholder="Username" required>

<input id="regPassword" type="password" class="form-control my-2" placeholder="Password" required>

<input id="regConfirmPassword" type="password" class="form-control my-2" placeholder="Confirm Password" required>

<select id="regRole" class="form-select my-2">
<option value="user">User</option>
</select>

<button class="btn-modern w-100 mt-3">Register</button>

</form>

<p class="mt-3">
Already have an account?
<a href="index.html">Login</a>
</p>

</div>

</body>
</html>
