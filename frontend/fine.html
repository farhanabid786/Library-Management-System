<!DOCTYPE html>
<html>
<head>
<title>Pay Fine</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="js/script.js"></script>
</head>
<body class="container mt-4">

<h3>Pay Fine</h3>

<form onsubmit="return validateFine()">

<label>Fine Amount</label>
<input id="fineAmount" class="form-control my-2" readonly>

<div class="form-check">
<input type="checkbox" id="finePaid" class="form-check-input">
<label class="form-check-label">Fine Paid</label>
</div>

<button class="btn btn-primary mt-3">Confirm</button>

</form>

</body>
</html>
